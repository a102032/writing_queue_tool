<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f97ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b2b6b" flood-opacity="0.32"/>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g)"/>
  <g transform="translate(30.72, 30.72) scale(0.88)">
    <g filter="url(#sh)">
      <!-- writing sheet -->
      <rect x="118" y="86" width="276" height="340" rx="28" fill="#ffffff"/>
      <!-- written lines, in the app's stage colours -->
      <rect x="160" y="150" width="192" height="26" rx="13" fill="#2496C8"/>
      <rect x="160" y="204" width="192" height="26" rx="13" fill="#93297E"/>
      <rect x="160" y="258" width="192" height="26" rx="13" fill="#7FBC3F"/>
      <rect x="160" y="312" width="120" height="26" rx="13" fill="#cbd5e1"/>
    </g>
    <!-- queue badge -->
    <circle cx="376" cy="118" r="74" fill="#ffffff"/>
    <circle cx="376" cy="118" r="62" fill="#F59E0B"/>
    <text x="376" y="119" text-anchor="middle" dominant-baseline="central"
          font-family="Nunito, 'Trebuchet MS', Verdana, sans-serif" font-weight="900"
          font-size="86" fill="#ffffff">1</text>
  </g>
</svg>